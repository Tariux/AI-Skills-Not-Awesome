<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whizbang Visual Companion</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #1a1a1a; line-height: 1.6; }
    .container { max-width: 1000px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e0e0e0; }
    .header h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    .connection { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: #666; }
    .connection.connected .dot { background: #22c55e; }
    .connection .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .subtitle { color: #666; font-size: 1rem; margin: 8px 0 24px; }
    h2 { font-size: 1.25rem; font-weight: 600; margin: 0 0 16px; }
    h3 { font-size: 1rem; font-weight: 600; margin: 0 0 8px; }
    .section { margin-bottom: 24px; }
    .options { display: flex; flex-wrap: wrap; gap: 16px; }
    .option { flex: 1; min-width: 280px; padding: 20px; background: white; border: 2px solid #e0e0e0; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
    .option:hover { border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59,130,246,0.15); }
    .option.selected { border-color: #3b82f6; background: #eff6ff; }
    .option .letter { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: #3b82f6; color: white; font-weight: 700; margin-bottom: 12px; }
    .option.selected .letter { background: #1d4ed8; }
    .cards { display: flex; flex-wrap: wrap; gap: 16px; }
    .card { flex: 1; min-width: 300px; background: white; border: 2px solid #e0e0e0; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.2s; }
    .card:hover { border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59,130,246,0.15); }
    .card.selected { border-color: #3b82f6; }
    .card-image { height: 180px; background: #f3f4f6; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 0.875rem; }
    .card-body { padding: 16px; }
    .split { display: flex; gap: 16px; }
    .split .mockup { flex: 1; }
    .mockup { background: white; border: 2px solid #e0e0e0; border-radius: 12px; overflow: hidden; }
    .mockup-header { padding: 12px 16px; background: #f9fafb; border-bottom: 1px solid #e0e0e0; font-weight: 600; font-size: 0.875rem; }
    .mockup-body { padding: 24px; min-height: 200px; }
    .pros-cons { display: flex; gap: 24px; }
    .pros, .cons { flex: 1; }
    .pros h4 { color: #16a34a; margin: 0 0 12px; }
    .cons h4 { color: #dc2626; margin: 0 0 12px; }
    .pros ul, .cons ul { margin: 0; padding-left: 20px; }
    .pros li, .cons li { margin-bottom: 8px; }
    .mock-nav { padding: 12px 16px; background: #f9fafb; border-bottom: 1px solid #e0e0e0; font-family: monospace; font-size: 0.875rem; color: #666; }
    .mock-sidebar { width: 240px; background: #f9fafb; border-right: 1px solid #e0e0e0; padding: 16px; }
    .mock-content { flex: 1; padding: 24px; }
    .mock-button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .mock-button:hover { background: #2563eb; }
    .mock-input { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; width: 100%; max-width: 300px; }
    .placeholder { padding: 40px; text-align: center; color: #9ca3af; background: #f3f4f6; border-radius: 8px; }
    .waiting { display: flex; align-items: center; justify-content: center; min-height: 60vh; color: #9ca3af; font-size: 1.125rem; }
    .error { padding: 16px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; color: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Whizbang Visual Companion</h1>
      <div class="connection" id="connection">
        <span class="dot"></span>
        <span id="status">Connecting...</span>
      </div>
    </div>
    <div id="content">{{CONTENT}}</div>
  </div>
  <script>{{HELPER}}</script>
  <script>
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { document.getElementById('status').textContent = 'Connected'; document.getElementById('connection').classList.add('connected'); };
    ws.onclose = () => { document.getElementById('status').textContent = 'Disconnected'; document.getElementById('connection').classList.remove('connected'); };
    ws.onmessage = (e) => { try { const msg = JSON.parse(e.data); if (msg.type === 'reload') location.reload(); } catch {} };
    function toggleSelect(el) { el.classList.toggle('selected'); }
  </script>
</body>
</html>
